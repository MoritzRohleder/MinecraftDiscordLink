plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    // Libraries are bundled by the loader projects
    compileOnly("net.dv8tion:JDA:${jda_version}") {
        exclude module: 'opus-java'
        exclude module: 'tink'
        // Provided by Minecraft
        exclude group: 'org.slf4j'
    }
    compileOnly "net.fellbaum:jemoji:${jemoji_version}"
    compileOnly "com.electronwill.night-config:toml:${night_config_version}"

    testImplementation "com.electronwill.night-config:toml:${night_config_version}"
    testRuntimeOnly "org.slf4j:slf4j-simple:2.0.9"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
