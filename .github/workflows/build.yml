name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.loader }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build ${{ matrix.loader }} jar
        run: ./gradlew :${{ matrix.loader }}:build

      - name: Upload ${{ matrix.loader }} jar
        uses: actions/upload-artifact@v7
        with:
          name: minecraftdiscordlink-${{ matrix.loader }}
          path: |
            ${{ matrix.loader }}/build/libs/*.jar
            !${{ matrix.loader }}/build/libs/*-sources.jar
            !${{ matrix.loader }}/build/libs/*-javadoc.jar
          if-no-files-found: error
