plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

configurations {
    // Libraries that are shipped inside the mod jar
    bundle
    implementation.extendsFrom bundle
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation include("me.lucko:fabric-permissions-api:${fabric_permissions_api_version}")

    bundle("net.dv8tion:JDA:${jda_version}") {
        // Voice support is not needed
        exclude module: 'opus-java'
        exclude module: 'tink'
        // Provided by Minecraft
        exclude group: 'org.slf4j'
    }
    bundle "net.fellbaum:jemoji:${jemoji_version}"
    bundle "com.electronwill.night-config:toml:${night_config_version}"
}

// Loom's include is not transitive, so every resolved library is added explicitly
configurations.include.withDependencies { deps ->
    configurations.bundle.resolvedConfiguration.resolvedArtifacts.each { artifact ->
        deps.add(project.dependencies.create(artifact.moduleVersion.id.toString()))
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
